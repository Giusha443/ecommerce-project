<div class="app-not-found">
  <h2>404 Error!</h2>
  <p>We can't find the thing you wanted!</p>
  <div class="app-not-found__buttons">
    <button class="mat-icon-button" routerLink="/main" mat-button>
      <mat-icon>home</mat-icon>
      <span>Home</span>
    </button>
    <button class="mat-icon-button" mat-button (click)="back()">
      <mat-icon>arrow_back</mat-icon>
      <span>back</span>
    </button>
  </div>
  <div class="app-not-found__background">404</div>
</div>
